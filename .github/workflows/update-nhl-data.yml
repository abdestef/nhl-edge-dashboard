name: Update NHL data
on:
  workflow_dispatch:
  schedule:
    - cron: "*/10 * * * *"
  push:
    branches: [main]
    paths:
      - ".github/workflows/update-nhl-data.yml"
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch public NHL data
        run: |
          mkdir -p data
          python - <<'PY'
          import json, urllib.request, datetime
          base = "https://api-web.nhle.com/v1"
          def get(path):
              req = urllib.request.Request(base + path, headers={"User-Agent":"NHL-EDGE/1.0"})
              with urllib.request.urlopen(req, timeout=25) as r:
                  return json.load(r)
          payload = {
              "updatedAt": datetime.datetime.now(datetime.timezone.utc).isoformat(),
              "standings": get("/standings/now").get("standings", []),
              "games": get("/score/now").get("games", [])
          }
          if len(payload["standings"]) < 30:
              raise SystemExit("NHL standings response incomplete")
          with open("data/nhl.json", "w", encoding="utf-8") as f:
              json.dump(payload, f, ensure_ascii=False)
          print("Saved", len(payload["standings"]), "teams and", len(payload["games"]), "games")
          PY
      - name: Commit refreshed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/nhl.json
          git diff --cached --quiet || (git commit -m "Update NHL data snapshot" && git push)
